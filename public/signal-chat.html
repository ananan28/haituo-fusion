<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Signal 对话</title><style>
:root{color-scheme:dark;--translation-color:#55baff;--translation-size:14px}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0c1420;color:#e8edf5;font:14px/1.6 system-ui,sans-serif}#messages{height:100%;overflow:auto;display:flex;flex-direction:column;padding:22px;gap:12px}.bubble{width:fit-content;max-width:86%;padding:12px 16px;background:#1b293b;border-radius:16px;overflow-wrap:anywhere;flex-shrink:0}.bubble.out{align-self:flex-end;background:#2547a0}.sender{color:#aebdd4}.body,.original,.translation{white-space:pre-wrap}.original{opacity:.75;border-bottom:1px solid #ffffff20;padding-bottom:7px;margin-bottom:7px}.translation{color:var(--translation-color);font-size:var(--translation-size);border-top:1px solid #ffffff24;margin-top:8px;padding-top:8px}.time{display:block;text-align:right;color:#aec0d9;font-size:10px;margin-top:6px}#empty{position:fixed;top:44%;width:100%;text-align:center;color:#859bb8;pointer-events:none}.retry{background:transparent;border:1px solid #7089b0;border-radius:7px;color:#dceaff;cursor:pointer;margin-top:9px;padding:4px 9px}[hidden]{display:none!important}
</style></head><body><div id="empty">此会话暂无本地消息</div><main id="messages" aria-live="polite"></main></body></html>
