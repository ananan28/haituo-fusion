api.onResult(data=>{if(data.type==='capture'){document.getElementById('screen').src=data.image;captureOnly=data.mode==='capture';document.body.classList.toggle('capture-only',captureOnly);document.getElementById('modeLabel').textContent=captureOnly?'截图与标注':'截图翻译';document.getElementById('hint').textContent=captureOnly?'全屏截图 · 可调整选区、字号、线宽及马赛克大小 · Esc 退出':'拖动框选 · 可调整边框或移动选区 · Esc 退出';return}if(data.requestId!==requestId)return;status.textContent=data.status||'';status.dataset.error=String(data.failed===true);if(data.translation){result=data;working.hidden=true;for(const id of ['original','translated','compare','copy'])document.getElementById(id).disabled=false;render()}else if(data.failed){working.hidden=true}position()});
</script></body></html>
