<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px system-ui}body{cursor:crosshair;background:#111}#screen{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#mask{position:absolute;inset:0;background:#0006;pointer-events:none}#selection{display:none;position:absolute;border:1px solid #ff5b5b;box-shadow:0 0 0 10000px #0006;cursor:move}#selection.active{display:block}#translation{position:absolute;inset:0;overflow:hidden;cursor:text}#translation[hidden]{display:none}.block{position:absolute;white-space:pre-wrap;overflow-wrap:anywhere;padding:2px;line-height:1.35;overflow:auto;border-radius:2px;box-shadow:0 1px 3px #0002}#translation.flow{left:16px;right:16px;top:auto;bottom:16px;max-height:60%;padding:14px 16px;background:rgba(17,24,32,.92);color:#f1f5f9;border:1px solid #ffffff24;border-radius:10px;font-size:18px;line-height:1.5;white-space:pre-wrap;overflow:auto;box-shadow:0 6px 24px #0006}#translation.compare{display:block;overflow:hidden;padding:0;background:transparent}.pair{position:absolute;padding:4px 7px;background:rgba(17,24,32,.92);color:#e6eef5;border:1px solid #ffffff26;border-radius:6px;min-width:0;overflow-wrap:anywhere;font-size:14px;line-height:1.45;box-sizing:border-box;box-shadow:0 2px 10px #0006}.source,.target{white-space:pre-wrap}.source{color:#b9c7d3}.target{color:#8be9fd;margin-top:5px;padding-top:4px;border-top:1px solid #ffffff1f}.pair.fallback{position:absolute;left:16px;right:16px;bottom:16px;top:auto;width:auto;max-height:60%;overflow:auto;padding:12px 14px;border-radius:10px}.handle{position:absolute;width:9px;height:9px;background:#fff;border:1px solid #ff5b5b;border-radius:50%;z-index:5}.handle[data-h=nw]{left:-5px;top:-5px;cursor:nwse-resize}.handle[data-h=n]{left:50%;top:-5px;cursor:ns-resize}.handle[data-h=ne]{right:-5px;top:-5px;cursor:nesw-resize}.handle[data-h=e]{right:-5px;top:50%;cursor:ew-resize}.handle[data-h=se]{right:-5px;bottom:-5px;cursor:nwse-resize}.handle[data-h=s]{left:50%;bottom:-5px;cursor:ns-resize}.handle[data-h=sw]{left:-5px;bottom:-5px;cursor:nesw-resize}.handle[data-h=w]{left:-5px;top:50%;cursor:ew-resize}#toolbar{display:none;position:fixed;z-index:20;align-items:center;gap:6px;max-width:calc(100vw - 16px);padding:8px 10px;border-radius:9px;background:#25282f;color:#fff;box-shadow:0 5px 22px #0005;cursor:default;flex-wrap:wrap}button{font:inherit;border:0;border-radius:5px;padding:7px 10px;color:white;background:#404752;cursor:pointer;white-space:nowrap}button:hover{background:#566170}button:disabled{opacity:.4;cursor:default}#translate{background:#e74b4b}#status{max-width:420px;font-size:12px;line-height:1.4;overflow-wrap:anywhere}#hint{position:fixed;left:18px;top:15px;background:#222b;color:white;border-radius:7px;padding:10px 14px;pointer-events:none}#working{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;padding:9px 16px;border-radius:999px;background:rgba(17,24,32,.9);color:#f1f5f9;border:1px solid #ffffff26;pointer-events:none;font-size:14px;box-shadow:0 4px 18px #0006}#working[hidden]{display:none}
#editor{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}#editor.editing{pointer-events:auto;cursor:crosshair}body:not(.capture-only) .capture-tool{display:none}body.capture-only #translate,body.capture-only #original,body.capture-only #translated,body.capture-only #compare,body.capture-only #copy{display:none}#annotationText{width:130px;background:#fff;color:#111;border:1px solid #aaa;border-radius:4px;padding:6px}#annotationColor{width:32px;height:28px;padding:0;border:0}
</style></head><body><img id="screen" alt="屏幕截图"><div id="mask"></div><div id="selection"><div id="translation" hidden></div><canvas id="editor"></canvas><div id="working" hidden>正在翻译…</div><i class="handle" data-h="nw"></i><i class="handle" data-h="n"></i><i class="handle" data-h="ne"></i><i class="handle" data-h="e"></i><i class="handle" data-h="se"></i><i class="handle" data-h="s"></i><i class="handle" data-h="sw"></i><i class="handle" data-h="w"></i></div><div id="toolbar"><span id="status">框选文字后自动翻译</span><button id="translate">翻译</button><button id="original" disabled>原图</button><button id="translated" disabled>译文</button><button id="compare" disabled>原文下方译文</button><button id="copy" disabled>复制译文</button><button class="capture-tool" id="move">调整选区</button><button class="capture-tool" id="pen">画笔</button><button class="capture-tool" id="rectangle">方框</button><button class="capture-tool" id="textTool">文字</button><button class="capture-tool" id="mosaic">马赛克</button><button class="capture-tool" id="cover">实色遮挡</button><input class="capture-tool" id="annotationColor" aria-label="标注颜色" type="color" value="#ff3b30"><input class="capture-tool" id="annotationText" aria-label="标注文字" placeholder="输入标注文字"><label class="capture-tool">字号 <input id="fontSize" aria-label="文字字号" type="number" min="8" max="96" value="18" style="width:54px"></label><label class="capture-tool">画笔/方框线宽 <input id="strokeSize" aria-label="画笔与方框线宽" type="number" min="1" max="40" value="3" style="width:48px"></label><label class="capture-tool">马赛克 <input id="mosaicSize" aria-label="马赛克大小" type="number" min="4" max="64" value="12" style="width:48px"></label><button class="capture-tool" id="undo">撤销</button><button class="capture-tool" id="copyImage">复制截图并关闭</button><button id="reset">重新框选</button><button id="close">关闭</button></div><div id="hint">拖动框选 · 可调整边框或移动选区 · Esc 退出</div><script>
const api=window.haituoScreenshot,box=document.getElementById('selection'),layer=document.getElementById('translation'),bar=document.getElementById('toolbar'),status=document.getElementById('status'),working=document.getElementById('working');let rect=null,drag=null,requestId=0,result=null,captureOnly=false,editTool='move',commands=[],stroke=null;
const editor=document.getElementById('editor'),drawing=editor.getContext('2d');
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function position(){if(!rect)return;Object.assign(box.style,{left:rect.x+'px',top:rect.y+'px',width:rect.width+'px',height:rect.height+'px'});box.classList.add('active');if(editor.width!==Math.round(rect.width)||editor.height!==Math.round(rect.height)){editor.width=Math.round(rect.width);editor.height=Math.round(rect.height);commands=[];paint()}bar.style.display='flex';bar.style.left=clamp(rect.x,8,innerWidth-bar.offsetWidth-8)+'px';bar.style.top=clamp(rect.y+rect.height+12,8,innerHeight-bar.offsetHeight-8)+'px'}
function clearResult(){requestId++;result=null;layer.hidden=true;layer.replaceChildren();working.hidden=true;for(const id of ['original','translated','compare','copy'])document.getElementById(id).disabled=true}
function translate(){if(!rect||rect.width<8||rect.height<8)return;clearResult();working.hidden=false;status.textContent='正在识别并翻译…';api.select({...rect,requestId}).catch(error=>{working.hidden=true;status.textContent='调用失败，请重新框选或检查接口'});}
function render(mode='translated'){if(!result)return;layer.hidden=mode==='original';layer.className=mode==='compare'?'compare':'';layer.replaceChildren();if(mode==='original')return;if(mode==='compare'){
const blocks=(result.blocks||[]).filter(b=>b.original&&b.translation);
if(blocks.length){const placed=[];for(const block of [...blocks].sort((a,b)=>a.y-b.y||a.x-b.x)){const el=document.createElement('div');el.className='pair';const source=document.createElement('div'),target=document.createElement('div');source.className='source';target.className='target';source.textContent=block.original;target.textContent=block.translation;el.append(source,target);const left=clamp(rect.width*block.x/1000,0,Math.max(0,rect.width-80)),width=Math.min(rect.width-left,Math.max(100,rect.width*block.width/1000));el.style.left=left+'px';el.style.width=width+'px';layer.append(el);let top=Math.max(0,rect.height*block.y/1000);for(const previous of placed)if(left<previous.right&&left+width>previous.left&&top<previous.bottom&&top+el.offsetHeight>previous.top)top=previous.bottom+6;el.style.top=top+'px';placed.push({left,right:left+width,top,bottom:top+el.offsetHeight})}}
else{const el=document.createElement('div');el.className='pair fallback';for(const [name,text] of [['source',result.original],['target',result.translation]]){const part=document.createElement('div');part.className=name;part.textContent=text;el.append(part)}layer.append(el)}return}
layer.style.background='transparent';layer.style.color=result.foreground||'#171717';const blocks=result.blocks||[];if(blocks.length){for(const block of blocks){const el=document.createElement('div');el.className='block';el.textContent=block.translation;Object.assign(el.style,{left:block.x/10+'%',top:block.y/10+'%',width:block.width/10+'%',height:block.height/10+'%',background:result.background||'#fff',color:result.foreground||'#171717',fontSize:clamp(rect.height*block.height/1000*.7,11,24)+'px'});layer.append(el);let size=parseFloat(el.style.fontSize);while(el.scrollHeight>el.clientHeight+2&&size>10){size--;el.style.fontSize=size+'px'}}}else{layer.style.background='';layer.style.color='';layer.className+=' flow';layer.textContent=result.translation}}
addEventListener('pointerdown',e=>{if(e.button!==0||bar.contains(e.target)||(captureOnly&&editor.contains(e.target)&&editTool!=='move'))return;const handle=e.target.dataset.h,inside=rect&&box.contains(e.target);if(layer.contains(e.target)&&result&&!handle)return;clearResult();commands=[];paint();drag={x:e.clientX,y:e.clientY,old:rect?{...rect}:null,type:handle|| (inside?'move':'new')};if(drag.type==='new')rect={x:e.clientX,y:e.clientY,width:0,height:0};document.getElementById('mask').style.display='none';document.body.setPointerCapture(e.pointerId);e.preventDefault()});
addEventListener('pointermove',e=>{if(!drag)return;const x=clamp(e.clientX,0,innerWidth),y=clamp(e.clientY,0,innerHeight),dx=x-drag.x,dy=y-drag.y;if(drag.type==='new')rect={x:Math.min(drag.x,x),y:Math.min(drag.y,y),width:Math.abs(x-drag.x),height:Math.abs(y-drag.y)};else if(drag.type==='move')rect={...drag.old,x:clamp(drag.old.x+dx,0,innerWidth-drag.old.width),y:clamp(drag.old.y+dy,0,innerHeight-drag.old.height)};else{let l=drag.old.x,t=drag.old.y,r=l+drag.old.width,b=t+drag.old.height;if(drag.type.includes('w'))l=x;if(drag.type.includes('e'))r=x;if(drag.type.includes('n'))t=y;if(drag.type.includes('s'))b=y;rect={x:Math.min(l,r),y:Math.min(t,b),width:Math.abs(r-l),height:Math.abs(b-t)}}position()});
addEventListener('pointerup',()=>{if(!drag)return;drag=null;if(rect.width>=8&&rect.height>=8){position();if(captureOnly){status.textContent='可标注后复制截图；Ctrl / Command + C 复制';setTool('move')}else translate()}else{box.classList.remove('active');bar.style.display='none';rect=null}});
document.getElementById('translate').onclick=translate;document.getElementById('original').onclick=()=>render('original');document.getElementById('translated').onclick=()=>render('translated');document.getElementById('compare').onclick=()=>render('compare');document.getElementById('copy').onclick=()=>result&&api.copy(result.translation);document.getElementById('reset').onclick=()=>{clearResult();commands=[];paint();rect=null;box.classList.remove('active');bar.style.display='none';document.getElementById('mask').style.display='block'};document.getElementById('close').onclick=()=>api.cancel();addEventListener('keydown',e=>{if(e.key==='Escape')api.cancel();if(captureOnly&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();copyScreenshot()}});
function setTool(tool){editTool=tool;editor.classList.toggle('editing',captureOnly&&tool!=='move');for(const [id,name] of [['move','move'],['pen','pen'],['rectangle','rectangle'],['textTool','text'],['mosaic','mosaic'],['cover','cover']])document.getElementById(id).style.outline=tool===name?'2px solid #79b8ff':''}
function paint(context=drawing,list=commands){context.clearRect(0,0,editor.width,editor.height);for(const c of list){context.strokeStyle=c.color;context.fillStyle=c.color;context.lineWidth=c.strokeSize||3;context.lineCap='round';context.lineJoin='round';if(c.type==='text'){context.font=(c.fontSize||18)+'px system-ui';context.textBaseline='top';context.fillText(c.text,c.x,c.y)}else if(c.type==='cover'){context.fillStyle='#202020';context.fillRect(Math.min(c.x,c.endX),Math.min(c.y,c.endY),Math.abs(c.endX-c.x),Math.abs(c.endY-c.y))}else if(c.type==='mosaic'){const source=document.getElementById('screen'),x=Math.min(c.x,c.endX),y=Math.min(c.y,c.endY),width=Math.abs(c.endX-c.x),height=Math.abs(c.endY-c.y);if(width>0&&height>0&&source.naturalWidth){const small=document.createElement('canvas');small.width=Math.max(1,Math.ceil(width/(c.mosaicSize||12)));small.height=Math.max(1,Math.ceil(height/(c.mosaicSize||12)));const ctx=small.getContext('2d'),sx=source.naturalWidth/innerWidth,sy=source.naturalHeight/innerHeight;ctx.drawImage(source,(rect.x+x)*sx,(rect.y+y)*sy,width*sx,height*sy,0,0,small.width,small.height);context.imageSmoothingEnabled=false;context.drawImage(small,x,y,width,height);context.imageSmoothingEnabled=true}}else if(c.type==='rectangle'){context.strokeRect(c.x,c.y,c.endX-c.x,c.endY-c.y)}else{context.beginPath();c.points.forEach((p,i)=>i?context.lineTo(p.x,p.y):context.moveTo(p.x,p.y));if(c.points.length===1)context.lineTo(c.points[0].x+.1,c.points[0].y);context.stroke()}}}
const point=e=>({x:clamp(e.offsetX,0,editor.width),y:clamp(e.offsetY,0,editor.height)});
editor.onpointerdown=e=>{if(!captureOnly||editTool==='move')return;e.preventDefault();e.stopPropagation();editor.setPointerCapture(e.pointerId);const p=point(e),color=document.getElementById('annotationColor').value,sizes={fontSize:clamp(Number(document.getElementById('fontSize').value)||18,8,96),strokeSize:clamp(Number(document.getElementById('strokeSize').value)||3,1,40),mosaicSize:clamp(Number(document.getElementById('mosaicSize').value)||12,4,64)};if(editTool==='text'){const text=document.getElementById('annotationText').value.trim();if(text){commands.push({type:'text',...p,text,color,...sizes});paint()}else status.textContent='先在工具栏输入标注文字，再点截图位置';return}stroke={type:editTool,...p,endX:p.x,endY:p.y,points:[p],color,...sizes};commands.push(stroke);paint()};
editor.onpointermove=e=>{if(!stroke)return;const p=point(e);stroke.endX=p.x;stroke.endY=p.y;stroke.points.push(p);paint();e.stopPropagation()};editor.onpointerup=e=>{stroke=null;e.stopPropagation()};editor.onpointercancel=()=>{stroke=null};
for(const [id,tool] of [['move','move'],['pen','pen'],['rectangle','rectangle'],['textTool','text'],['mosaic','mosaic'],['cover','cover']])document.getElementById(id).onclick=()=>setTool(tool);
document.getElementById('undo').onclick=()=>{commands.pop();paint()};
async function copyScreenshot(){if(!captureOnly||!rect||rect.width<8||rect.height<8)return;const image=document.getElementById('screen');try{await image.decode();const scaleX=image.naturalWidth/innerWidth,scaleY=image.naturalHeight/innerHeight,canvas=document.createElement('canvas');canvas.width=Math.round(rect.width*scaleX);canvas.height=Math.round(rect.height*scaleY);const context=canvas.getContext('2d');context.drawImage(image,rect.x*scaleX,rect.y*scaleY,rect.width*scaleX,rect.height*scaleY,0,0,canvas.width,canvas.height);context.drawImage(editor,0,0,canvas.width,canvas.height);await api.copyImage(canvas.toDataURL('image/png'))}catch(error){status.textContent='复制截图失败：'+String(error.message||error)}}
document.getElementById('copyImage').onclick=copyScreenshot;
api.onResult(data=>{if(data.type==='capture'){document.getElementById('screen').src=data.image;captureOnly=data.mode==='capture';document.body.classList.toggle('capture-only',captureOnly);document.getElementById('hint').textContent=captureOnly?'全屏截图 · 可调整选区、字号、线宽及马赛克大小 · Esc 退出':'拖动框选 · 可调整边框或移动选区 · Esc 退出';return}if(data.requestId!==requestId)return;status.textContent=data.status||'';if(data.translation){result=data;working.hidden=true;for(const id of ['original','translated','compare','copy'])document.getElementById(id).disabled=false;render()}else if(data.failed){working.hidden=true}position()});
</script></body></html>
