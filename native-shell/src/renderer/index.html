<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>财盛聚合聊天</title><link rel="stylesheet" href="app.css"></head>
<body>
<header class="titlebar">
  <div class="brand"><b>财</b><span><strong>财盛聚合聊天</strong><small>内部测试版</small></span></div>
  <div id="quickAccounts" class="quick-accounts"></div>
  <div class="window-tools"><button id="addTop" title="添加账号">＋</button><button id="home" title="平台首页">⌂</button><button id="minimize" title="最小化">—</button><button id="maximize" title="最大化">□</button><button id="windowClose" title="关闭">×</button></div>
</header>
<aside>
  <nav id="services"></nav>
  <footer><button id="add">＋ 添加服务</button><button id="settings">⚙ 平台设置</button></footer>
</aside>
<main id="content"><section class="welcome"><div class="mark">财</div><h1>财盛聚合聊天</h1><p>集中管理多个完全独立的通信账号</p><button id="first">添加第一个服务</button></section></main>
<section class="rail">
  <button id="editCurrent" title="账号备注与设置">✎</button>
  <button id="refreshCurrent" title="刷新当前账号">↻</button>
  <button id="hardRefresh" title="强制刷新">⟳</button>
  <button id="restartCurrent" title="重启当前服务">⏻</button>
  <button id="muteCurrent" title="静音">♩</button>
  <button id="notifyCurrent" title="通知">♧</button>
  <button id="moveUp" title="向前移动">↑</button>
  <button id="moveDown" title="向后移动">↓</button>
</section>
<div id="toast" role="status"></div>
<dialog id="picker"><div class="dialog-title"><b>添加服务</b><button data-close="picker">×</button></div><p>每个账号的登录状态、缓存、代理和指纹完全独立。</p><div id="catalog"></div></dialog>
<dialog id="accountPane">
  <div class="dialog-title"><b>账号设置</b><button data-close="accountPane">×</button></div>
  <div class="tabs"><button class="tab active" data-tab="base">基本</button><button class="tab" data-tab="fingerprint">指纹</button><button class="tab" data-tab="proxy">代理</button></div>
  <form id="accountForm">
    <section data-page="base"><label>显示名称<input name="name" maxlength="60"></label><label>账号备注<textarea name="note" maxlength="240"></textarea></label><label>标记颜色<input name="color" type="color"></label><div class="checks"><label><input name="enabled" type="checkbox"> 启用服务</label><label><input name="muted" type="checkbox"> 静音</label><label><input name="notifications" type="checkbox"> 显示通知</label></div>
      <fieldset class="translation-settings"><legend>此账号翻译</legend><div class="checks"><label><input name="accountSpaceTranslate" type="checkbox"> 空格翻译</label><label><input name="accountBlockChinese" type="checkbox"> 禁止发送中文</label><label><input name="accountAutoTranslateIncoming" type="checkbox"> 自动翻译收到消息</label><label><input name="accountAutoSend" type="checkbox"> 翻译后自动发送</label></div><label>默认目标语言<select name="accountTarget"><option value="en">英语</option><option value="zh-CN">简体中文</option><option value="ja">日语</option><option value="ko">韩语</option><option value="es">西班牙语</option><option value="fr">法语</option><option value="de">德语</option><option value="ru">俄语</option></select></label></fieldset></section>
    <section data-page="fingerprint" hidden>
      <div class="grid"><label>语言<input name="language" placeholder="zh-CN"></label><label>时区<input name="timezone" placeholder="Asia/Shanghai"></label><label>宽度<input name="width" type="number" min="800" max="7680"></label><label>高度<input name="height" type="number" min="600" max="4320"></label><label>缩放<input name="scaleFactor" type="number" min=".5" max="3" step=".1"></label><label>CPU 核心<input name="cpuCores" type="number" min="1" max="64"></label><label>内存 GB<input name="memoryGB" type="number" min="1" max="128"></label><label>User-Agent<input name="userAgent"></label><label>WebGL 厂商<input name="webglVendor"></label><label>WebGL 渲染器<input name="webglRenderer"></label><label>纬度<input name="latitude" type="number" min="-90" max="90" step=".0001"></label><label>经度<input name="longitude" type="number" min="-180" max="180" step=".0001"></label></div>
      <div class="checks"><label><input name="canvasNoise" type="checkbox"> Canvas 稳定微扰</label><label><input name="audioNoise" type="checkbox"> 音频指纹微扰</label><label><input name="webrtc" type="checkbox"> 禁止 WebRTC 绕过代理</label></div>
    </section>
    <section data-page="proxy" hidden><label>代理类型<select name="proxyMode"><option value="direct">不使用代理</option><option value="http">HTTP</option><option value="https">HTTPS</option><option value="socks5">SOCKS5</option></select></label><label>代理地址<input name="proxyServer" placeholder="127.0.0.1:7890"></label><label>用户名<input name="proxyUsername"></label><label>密码<input name="proxyPassword" type="password"></label><button type="button" class="secondary" id="testProxy">测试代理连接</button></section>
    <div class="actions"><button type="button" class="danger" id="deleteAccount">删除账号</button><span></span><button type="button" class="secondary" data-close="accountPane">取消</button><button type="submit">保存设置</button></div>
  </form>
</dialog>
<dialog id="settingsPane"><div class="dialog-title"><b>平台设置</b><button data-close="settingsPane">×</button></div><form id="settingsForm"><div class="settings-columns"><section><h3>常规设置</h3><div class="checks vertical"><label><input name="startAtLogin" type="checkbox"> 开机自动启动</label><label><input name="minimizeToTray" type="checkbox"> 最小化到系统托盘</label><label><input name="closeToTray" type="checkbox"> 点击关闭时保留在托盘</label><label><input name="defaultMute" type="checkbox"> 新账号默认静音</label><label><input name="defaultNotifications" type="checkbox"> 新账号默认显示通知</label></div></section><section><h3>翻译设置</h3><div class="grid"><label>主要线路<select name="translationProvider"><option value="google">Google 翻译</option><option value="google-cn">Google 中国备用</option><option value="libre">LibreTranslate</option><option value="openai">OpenAI 兼容 AI</option></select></label><label>备用线路<select name="translationFallback"><option value="google-cn">Google 中国备用</option><option value="google">Google 翻译</option><option value="libre">LibreTranslate</option><option value="openai">OpenAI 兼容 AI</option></select></label><label>默认目标语言<select name="translationTarget"><option value="en">英语</option><option value="zh-CN">简体中文</option><option value="ja">日语</option><option value="ko">韩语</option><option value="es">西班牙语</option><option value="fr">法语</option><option value="de">德语</option><option value="ru">俄语</option></select></label><label>Libre 地址<input name="libreUrl" placeholder="可选"></label><label>AI 接口地址<input name="openaiUrl" placeholder="https://api.example.com/v1"></label><label>AI 模型<input name="openaiModel" placeholder="模型名称"></label><label>AI API 密钥<input name="apiKey" type="password" autocomplete="off" placeholder="留空不修改"><small id="apiKeyState"></small></label></div><div class="checks"><label><input name="translationEnabled" type="checkbox"> 启用翻译</label><label><input name="spaceTranslate" type="checkbox"> 空格翻译</label><label><input name="blockChinese" type="checkbox"> 禁止发送中文</label><label><input name="showOriginal" type="checkbox"> 显示原文</label><label><input name="autoSend" type="checkbox"> 翻译后自动发送（默认关）</label></div></section></div><div class="actions"><button type="button" class="secondary" id="dataFolder">打开数据目录</button><button type="button" class="secondary" id="clearTranslationCache">清空翻译缓存</button><span></span><button type="submit">保存设置</button></div></form></dialog>
<dialog id="serviceMenu"><div class="dialog-title"><b id="menuTitle">账号操作</b><button data-close="serviceMenu">×</button></div><div class="menu-grid"><button data-action="edit">备注与设置</button><button data-action="refresh">刷新</button><button data-action="hard">强制刷新</button><button data-action="clear">清缓存后刷新</button><button data-action="restart">重启服务</button><button data-action="toggle">启用/停用</button></div></dialog>
<script src="app.js"></script></body></html>
