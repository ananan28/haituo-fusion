name: Fusion platform regression
on:
  push:
    branches: ['fusion/signal', 'fusion/whatsapp', 'fusion/telegram']
  pull_request:
    paths: ['src/app/js/**', 'scripts/**', '.github/workflows/fusion-platform-regression.yml']
permissions:
  contents: read
jobs:
  synthetic-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HAITUO_QA_NODE_MODULES: ${{ runner.temp }}/haituo-qa/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and synthetic platform tests
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app/bundles/main.js
          node --check src/app/bundles/preload/main.js
          node --check src/app/js/caisheng-webview-preload.js
          node --test scripts/*.test.cjs
      - name: Install isolated DOM fixtures
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/haituo-qa" --ignore-scripts --package-lock=false jsdom@26.1.0 react@19.1.0 react-dom@19.1.0
      - name: Synthetic DOM and Signal component lifecycle
        shell: bash
        run: node --test scripts/*.dom.cjs
