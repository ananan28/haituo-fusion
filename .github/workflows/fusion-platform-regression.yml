name: Fusion platform regression
on:
  push:
    branches: ['fusion/signal', 'fusion/whatsapp', 'fusion/telegram']
  pull_request:
    paths: ['src/app/js/**', 'scripts/**', '.github/workflows/fusion-platform-regression.yml']
permissions:
  contents: read
jobs:
  synthetic-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and synthetic platform tests
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app/bundles/main.js
          node --check src/app/bundles/preload/main.js
          node --check src/app/js/caisheng-webview-preload.js
          node --test scripts/*.test.cjs
      - name: Install isolated DOM fixtures
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/haituo-qa" --ignore-scripts --package-lock=false jsdom@26.1.0 react@19.1.0 react-dom@19.1.0
      - name: Synthetic DOM and Signal component lifecycle
        env:
          HAITUO_QA_NODE_MODULES: ${{ runner.temp }}/haituo-qa/node_modules
        shell: bash
        run: |
          set -euo pipefail
          files=(scripts/signal-attachments.dom.cjs scripts/wa-rollback.dom.cjs)
          for optional in scripts/telegram-message-identity.dom.cjs scripts/wa-retranslate-lifecycle.dom.cjs; do
            [ ! -f "$optional" ] || files+=("$optional")
          done
          node --test "${files[@]}"
      - name: Report inherited compatibility failures
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          Active observer-mode and Signal component gates run above.
          The initial full DOM sweep found 18 inherited failures in local-chat-view.dom.cjs,
          whatsapp-records-scanner.dom.cjs and message-attachments.dom.cjs.
          Those suites target retired resident-storage behavior and are retained unchanged.
          Initial evidence: https://github.com/ananan28/haituo-fusion/actions/runs/40627663708
          A passing active gate does not certify those legacy suites or real logged-in accounts.
          REPORT
