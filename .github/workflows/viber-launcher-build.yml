name: Viber multi-account launcher build
on:
  workflow_dispatch:
  push:
    branches: ['fusion/viber-windows']
    paths:
      - 'launcher/**'
      - '.github/workflows/viber-launcher-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        shell: bash
        run: swiftc --version && sw_vers
      - name: Fetch Viber for bundling (best-effort)
        shell: bash
        run: |
          set -u
          VIBER_DMG=/tmp/Viber.dmg
          VIBER_SRC="$GITHUB_WORKSPACE/viber-src/Viber.app"
          rm -rf "$GITHUB_WORKSPACE/viber-src"
          ok=""
          for url in https://download.cdn.viber.com/desktop/mac_10_14/Viber.dmg https://download.cdn.viber.com/desktop/mac_10_13/Viber.dmg https://download.viber.com/desktop/mac/online/Viber.dmg; do
            curl -sS -L --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 900 -o "$VIBER_DMG" "$url" || continue
            [ "$(stat -f%z "$VIBER_DMG" 2>/dev/null || echo 0)" -gt 1024 ] || continue
            MNT=$(mktemp -d)
            if hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$VIBER_DMG" >/dev/null 2>&1; then
              APP=$(find "$MNT" -maxdepth 1 -name '*.app' | head -1)
              if [ -n "$APP" ]; then mkdir -p "$GITHUB_WORKSPACE/viber-src" && cp -R "$APP" "$VIBER_SRC"; ok=1; fi
              hdiutil detach "$MNT" -force >/dev/null 2>&1 || true
            fi
            [ -n "$ok" ] && break
          done
          if [ -n "$ok" ] && [ -d "$VIBER_SRC" ]; then
            echo "VIBER_APP_SRC=$VIBER_SRC" >> "$GITHUB_ENV"
            echo "bundling Viber into DMG"
          else
            echo "Viber fetch failed; building launcher-only DMG (auto-install fallback covers it)"
          fi
      - name: Build app bundle + dmg
        shell: bash
        run: |
          chmod +x launcher/build.sh
          ./launcher/build.sh
      - name: Verify bundle and dmg
        shell: bash
        run: |
          set -e
          APP=launcher/build/ViberLauncher.app
          test -x "$APP/Contents/MacOS/ViberLauncher"
          file "$APP/Contents/MacOS/ViberLauncher"
          codesign -dv "$APP" 2>&1 | head -5
          plutil -lint "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist"
          ls -lh launcher/ViberLauncher.dmg launcher/ViberLauncher.zip
          hdiutil verify launcher/ViberLauncher.dmg
          hdiutil imageinfo launcher/ViberLauncher.dmg | head -12
      - name: Mount dmg and check layout
        shell: bash
        run: |
          set -e
          MP=$(mktemp -d)
          hdiutil attach launcher/ViberLauncher.dmg -nobrowse -readonly -mountpoint "$MP" >/dev/null
          ls -la "$MP"
          test -x "$MP/ViberLauncher.app/Contents/MacOS/ViberLauncher"
          test -L "$MP/Applications"
          plutil -lint "$MP/ViberLauncher.app/Contents/Info.plist"
          hdiutil detach "$MP" >/dev/null
      - name: Smoke test GUI on desktop
        shell: bash
        run: |
          set -e
          APP=launcher/build/ViberLauncher.app
          "$APP/Contents/MacOS/ViberLauncher" --no-install >/tmp/launcher.stdout 2>/tmp/launcher.stderr &
          sleep 10
          pgrep -lf ViberLauncher || { echo "launcher process died"; cat /tmp/launcher.stderr; exit 1; }
          echo "--- state file ---"
          cat "$HOME/ViberMulti/accounts.json" || true
          echo "--- windows ---"
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' || true
          sleep 2
          screencapture -x launcher-gui.png
          ls -lh launcher-gui.png
          pkill -f 'ViberLauncher.app/Contents/MacOS/ViberLauncher' || true
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-gui-screenshot
          path: launcher-gui.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ViberLauncher-dmg
          path: launcher/ViberLauncher.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ViberLauncher-app-zip
          path: launcher/ViberLauncher.zip
          if-no-files-found: error
