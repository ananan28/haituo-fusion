name: Build desktop installers
on:
  workflow_dispatch:
  push:
    branches: ['main', 'build/**']
env:
  PYTHONUTF8: 1
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/tools-package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and regression tests
        run: node --test scripts/translation-validation.test.cjs scripts/network.test.cjs scripts/screenshot.test.cjs scripts/key-recovery.test.cjs scripts/preload-completion.test.cjs scripts/web-loading-effect.test.cjs scripts/protected-config.test.cjs scripts/config-redaction.test.cjs scripts/media-permission.test.cjs scripts/voice-endpoint.test.cjs scripts/translate-core.test.cjs scripts/network-proxy.test.cjs scripts/screenshot-input.test.cjs scripts/startup-settings-sync.test.cjs scripts/screenshot-source.test.cjs scripts/preview-concurrency.test.cjs scripts/startup-settings-deferred.test.cjs scripts/translation-pools-p2.test.cjs scripts/translation-pools-fallthrough.test.cjs scripts/preload-redaction-p1.test.cjs scripts/translate-strict-provider.test.cjs scripts/sqlkey-encrypt-fallback.test.cjs scripts/translation-pools-pause.test.cjs scripts/settings-single-writer.test.cjs scripts/unread-preview.test.cjs scripts/window-show-guards.test.cjs scripts/voice-capture-hook.test.cjs
      - name: Build installer and verify the release package
        run: python scripts/build.py --target ${{ matrix.target }}
      - name: Runtime tests (GUI only where a desktop session exists)
        run: python scripts/build.py --target ${{ matrix.target }} --runtime-tests-only
      - run: python scripts/package-source.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Haituo-${{ matrix.target }}
          path: |
            windows/out/*Setup.exe
            windows/verification/**
            macos/out/*.dmg
            macos/verification/**
            source-packages/*.zip
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows'
        with:
          name: Haituo-windows-unpacked
          path: windows/out/win-unpacked/**
