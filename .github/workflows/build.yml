name: Build and verify Haituo 1.6.2
on:
  workflow_dispatch:
  push:
    branches: ['build/1.6.2-local-records']
permissions:
  contents: write
env:
  PYTHONUTF8: 1
jobs:
  integrate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate and verify message records and gated child views
        run: |
          python scripts/integrate-native-records-162.py
          python scripts/sync-local-chat-view.py
          python scripts/finish-inprocess-162.py
          node --check src/app/bundles/main.js
          node --check src/app/bundles/preload/main.js
          node --check src/app/js/caisheng-webview-preload.js
          node --test scripts/*.test.cjs
      - name: Install isolated DOM/React test dependencies
        run: npm install --prefix "$RUNNER_TEMP/haituo-qa" --ignore-scripts --package-lock=false jsdom@26.1.0 react@19.1.0 react-dom@19.1.0
      - name: Test WhatsApp and actual Signal React attachment lifecycle
        run: node --test scripts/message-attachments.dom.cjs scripts/signal-attachments.dom.cjs scripts/local-chat-view.dom.cjs scripts/local-chat-view.dom.cjs
        env:
          HAITUO_QA_NODE_MODULES: ${{ runner.temp }}/haituo-qa/node_modules
      - name: Save the complete integrated editable source
        id: source
        run: |
          git config user.name 'Haituo Build'
          git config user.email 'haituo-build@users.noreply.github.com'
          git add src/app/bundles/main.js src/app/bundles/preload/main.js src/app/bundles/preload/wrapper.js src/app/js/caisheng-webview-preload.js README.md START-HERE.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat: native local bilingual message records and gated profile views (1.6.2)'
            git push origin HEAD:build/1.6.2-local-records
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: integrate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/tools-package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All regression tests on the target OS
        run: node --test scripts/*.test.cjs
      - name: Build and verify clean production package
        run: python scripts/build.py --target ${{ matrix.target }}
      - name: Verify real native encrypted local message database
        run: node scripts/local-chat-native-check.cjs
      - name: Verify gated child Signal initialization and profile routing
        timeout-minutes: 4
        run: node scripts/inprocess-native-check.cjs
      - name: Normal native launch and durable offline restart check
        run: node scripts/native-attachments-check.cjs
      - name: Verify native dependencies and network transport
        run: python scripts/build.py --target ${{ matrix.target }} --runtime-tests-only
      - name: Package complete current editable source
        run: python scripts/package-source.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Haituo-1.6.2-verification-${{ matrix.target }}
          path: |
            audit-results/**
            windows/verification/**
            macos/verification/**
      - uses: actions/upload-artifact@v4
        with:
          name: Haituo-1.6.2-${{ matrix.target }}
          path: |
            windows/out/*Setup.exe
            macos/out/*.dmg
            source-packages/*.zip
