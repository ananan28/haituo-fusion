name: Viber Windows isolation probe
on:
  workflow_dispatch:
  push:
    branches: ['fusion/viber-windows']
    paths:
      - 'scripts/viber-isolation.ps1'
      - '.github/workflows/viber-isolation.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Viber isolation probe
        shell: pwsh
        run: ./scripts/viber-isolation.ps1
      - name: Print evidence JSON
        if: always()
        shell: pwsh
        run: Get-Content audit-results/viber-windows-isolation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viber-windows-isolation
          path: audit-results/viber-windows-isolation.json
          if-no-files-found: error
