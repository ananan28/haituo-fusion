name: Build Caisheng Signal Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - patches/caisheng-signal.patch
      - .github/workflows/build-windows.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Caisheng build files
        uses: actions/checkout@v4

      - name: Checkout official Signal Desktop
        shell: bash
        run: git clone --depth 1 https://github.com/signalapp/Signal-Desktop.git signal

      - name: Apply Caisheng patch
        shell: bash
        run: |
          cd signal
          git apply --check ../patches/caisheng-signal.patch
          git apply ../patches/caisheng-signal.patch

      - name: Apply runtime reliability fixes
        shell: python
        run: |
          from pathlib import Path

          main = Path("signal/app/main.main.ts")
          text = main.read_text(encoding="utf-8")
          text = text.replace(
              "if (params.partition !== expectedPartition) {",
              "if (params.partition !== expectedPartition && !params.partition.startsWith(expectedPartition + '-')) {",
          )
          text = text.replace(
              "!DISABLE_SCREEN_SECURITY &&\n    (contentProtection ??",
              "false &&\n    (contentProtection ??",
          )
          main.write_text(text, encoding="utf-8")

          bridge = Path("signal/app/caishengWebviewTranslation.main.ts")
          text = bridge.read_text(encoding="utf-8")
          text = text.replace(
              "if (!ALLOWED_HOSTS.has(hostname)) {",
              "if (!ALLOWED_HOSTS.has(hostname) && !url.startsWith('file:')) {",
          )
          bridge.write_text(text, encoding="utf-8")

          context = Path("signal/ts/windows/context.preload.ts")
          text = context.read_text(encoding="utf-8")
          text = text.replace(
              "  caishengLogin: (\n    credentials: CaishengLoginCredentials\n  ) => Promise<CaishengLoginIpcResult>;",
              "  caishengLogin: (\n    credentials: CaishengLoginCredentials\n  ) => Promise<CaishengLoginIpcResult>;\n  caishengTranslate: (text: string, target: string) => Promise<{ text: string }>;",
          )
          text = text.replace(
              "  caishengLogin(credentials) {\n    return ipcRenderer.invoke('caisheng:login', credentials);\n  },",
              "  caishengLogin(credentials) {\n    return ipcRenderer.invoke('caisheng:login', credentials);\n  },\n  caishengTranslate(text, target) {\n    return ipcRenderer.invoke('caisheng:webview-translate', text, target);\n  },",
          )
          context.write_text(text, encoding="utf-8")

          translation = Path("signal/ts/services/caishengTranslation.dom.ts")
          text = translation.read_text(encoding="utf-8")
          needle = "  if (!text.trim()) throw new Error('请输入要翻译的内容');"
          replacement = needle + "\n  if (settings.provider === 'auto' || settings.provider === 'google-free' || settings.provider === 'mymemory') {\n    const result = await window.SignalContext.caishengTranslate(text, settings.targetLanguage);\n    return result.text;\n  }"
          text = text.replace(needle, replacement)
          translation.write_text(text, encoding="utf-8")

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: signal/.nvmrc

      - name: Enable pinned pnpm
        shell: bash
        working-directory: signal
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        shell: bash
        working-directory: signal
        env:
          NPM_CONFIG_LOGLEVEL: verbose
          NPM_CONFIG_NODE_GYP: ${{ github.workspace }}\\signal\\noop.js
        run: |
          touch noop.js
          pnpm install --frozen-lockfile
          rm noop.js

      - name: Remove Signal signing certificate configuration
        shell: cmd
        working-directory: signal
        run: |
          copy package.json temp.json
          del package.json
          type temp.json | findstr /v certificateSubjectName | findstr /v certificateSha1 > package.json

      - name: Prepare build
        shell: bash
        working-directory: signal
        run: |
          pnpm run prepare-beta-build
          pnpm run generate
          pnpm run build:preload-cache

      - name: Run Caisheng translation tests
        shell: bash
        working-directory: signal
        run: pnpm run test-node -- --grep "Caisheng translation"

      - name: Build Windows x64 installer
        shell: bash
        working-directory: signal
        env:
          DISABLE_INSPECT_FUSE: on
        run: pnpm run build:release --publish=never --x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Caisheng-Signal-Windows-x64
          path: |
            signal/release/*.exe
            signal/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
