name: Build Caisheng MultiChat Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'scripts/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare pinned Signal and Java runtimes
        run: npm run prepare:signal
      - name: Verify bundled runtimes
        run: npm run verify:signal
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm run build
          npm test
      - name: Build installer and portable EXE
        run: npm run dist:win
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter '*.exe'
          if (-not ($files.Name -match 'Setup')) { throw 'NSIS installer missing' }
          if (-not ($files.Name -match 'Portable')) { throw 'Portable EXE missing' }
          $files | Select-Object Name,Length | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: Caisheng-MultiChat-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
