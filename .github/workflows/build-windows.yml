name: 构建财盛聚合聊天 Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native-shell/**
      - assets/windows/**
      - .github/workflows/build-windows.yml

concurrency:
  group: caisheng-native-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native-shell
    steps:
      - name: 获取财盛源码
        uses: actions/checkout@v4

      - name: 验证独立平台边界
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'native-shell/package.json')) { throw '缺少财盛独立项目源码' }
          $files = Get-ChildItem native-shell -Recurse -File | Where-Object {
            $_.Extension -in '.js','.cjs','.mjs','.ts','.tsx','.json','.html','.css','.scss','.yml','.yaml'
          }
          $forbidden = $files | Select-String -Pattern 'OneChat-Dev/onechat|org\.ferdium|Ferdium|signalapp/Signal-Desktop' -CaseSensitive:$false
          if ($forbidden) { $forbidden | Format-Table Path,LineNumber,Line; throw '检测到第三方平台/Signal Desktop 外壳残留' }

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: native-shell/package-lock.json

      - name: 安装固定依赖
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: 准备内置 Signal 运行环境
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signalVersion = '0.14.7'
          $vendor = Join-Path $PWD 'vendor/signal-runtime'
          $temp = Join-Path $env:RUNNER_TEMP 'caisheng-signal-runtime'
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $vendor,(Join-Path $vendor 'signal-cli'),(Join-Path $vendor 'jre'),$temp | Out-Null
          $archive = Join-Path $temp 'signal-cli.tar.gz'
          Invoke-WebRequest "https://github.com/AsamK/signal-cli/releases/download/v$signalVersion/signal-cli-$signalVersion.tar.gz" -OutFile $archive
          $extract = Join-Path $temp 'signal-cli'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $archive -C $extract
          $jar = Get-ChildItem $extract -Recurse -Filter "signal-cli-$signalVersion.jar" | Select-Object -First 1
          if (-not $jar) { throw '下载的 signal-cli 中缺少主程序' }
          Copy-Item (Join-Path $jar.Directory.Parent.FullName '*') (Join-Path $vendor 'signal-cli') -Recurse -Force
          $javaZip = Join-Path $temp 'adoptium-jre25.zip'
          Invoke-WebRequest 'https://api.adoptium.net/v3/binary/latest/25/ga/windows/x64/jre/hotspot/normal/eclipse' -OutFile $javaZip
          $javaExtract = Join-Path $temp 'jre'
          Expand-Archive $javaZip -DestinationPath $javaExtract -Force
          $java = Get-ChildItem $javaExtract -Recurse -Filter 'java.exe' | Where-Object { $_.FullName -match '\\bin\\java\.exe$' } | Select-Object -First 1
          if (-not $java) { throw '下载的 Adoptium JRE 中缺少 java.exe' }
          Copy-Item (Join-Path $java.Directory.Parent.FullName '*') (Join-Path $vendor 'jre') -Recurse -Force
          & (Join-Path $vendor 'jre/bin/java.exe') -version
          & (Join-Path $vendor "signal-cli/lib/signal-cli-$signalVersion.jar") --version

      - name: 检查与测试
        shell: pwsh
        run: |
          npm run check
          npm test

      - name: 构建 Windows 安装包
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item ../assets/windows/caisheng.ico build/icon.ico -Force
          npm run dist
          if (-not (Test-Path 'out/win-unpacked/resources/signal-runtime/jre/bin/java.exe')) { throw '安装包未包含 Java 运行时' }
          if (-not (Test-Path 'out/win-unpacked/resources/signal-runtime/signal-cli/lib/signal-cli-0.14.7.jar')) { throw '安装包未包含 signal-cli' }

      - name: 启动冒烟测试
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'out/win-unpacked/*.exe' | Where-Object Name -eq '财盛聚合聊天.exe' | Select-Object -First 1
          if (-not $exe) { throw '找不到财盛聚合聊天未打包程序' }
          $smokeFile = Join-Path $env:RUNNER_TEMP 'caisheng-smoke.ok'
          $smokeLog = $smokeFile + '.log'
          Remove-Item $smokeFile,$smokeLog -Force -ErrorAction SilentlyContinue
          $env:CAISHENG_SMOKE_TEST = '1'
          $env:CAISHENG_SMOKE_FILE = $smokeFile
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $smokeFile)) {
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path $smokeFile)) {
            if (Test-Path $smokeLog) { Get-Content $smokeLog }
            & taskkill /PID $process.Id /T /F 2>$null | Out-Null
            throw '启动冒烟测试超时：未收到主界面成功哨兵'
          }
          $result = (Get-Content $smokeFile -Raw).Trim()
          & taskkill /PID $process.Id /T /F 2>$null | Out-Null
          if ($result -ne 'OK') { throw "启动冒烟测试返回无效结果：$result" }
          Write-Host '财盛主界面启动验证通过'

      - name: 验证安装版与便携版
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem 'out/财盛聚合聊天-安装版-*-x64.exe')
          $portable = @(Get-ChildItem 'out/财盛聚合聊天-便携版-*-x64.exe')
          if ($setup.Count -ne 1) { throw "安装版数量不正确：$($setup.Count)" }
          if ($portable.Count -ne 1) { throw "便携版数量不正确：$($portable.Count)" }
          if ($setup[0].Length -lt 10MB -or $portable[0].Length -lt 10MB) { throw 'EXE 文件异常小' }

      - name: 上传安装版
        uses: actions/upload-artifact@v4
        with:
          name: 财盛聚合聊天-安装版-Windows-x64
          path: native-shell/out/财盛聚合聊天-安装版-*-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: 上传便携版
        uses: actions/upload-artifact@v4
        with:
          name: 财盛聚合聊天-便携版-Windows-x64
          path: native-shell/out/财盛聚合聊天-便携版-*-x64.exe
          if-no-files-found: error
          retention-days: 14
