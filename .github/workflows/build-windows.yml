name: Build Caisheng Independent Platform Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - overlays/platform-v3/**
      - assets/windows/**
      - .github/workflows/build-windows.yml

concurrency:
  group: caisheng-platform-v3-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Caisheng build files
        uses: actions/checkout@v4

      - name: Checkout independent platform core
        shell: bash
        run: git clone --depth 1 https://github.com/OneChat-Dev/onechat.git platform

      - name: Apply Caisheng platform identity
        shell: python
        run: |
          import json
          import shutil
          from pathlib import Path

          root = Path("platform")
          package_path = root / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package.update({
              "name": "caisheng-multichat",
              "productName": "财盛聚合聊天",
              "desktopName": "caisheng-multichat.desktop",
              "appId": "com.caisheng.multichat",
              "description": "财盛独立聚合聊天平台",
              "author": "Caisheng Group",
              "homepage": "https://github.com/ananan28/WS-",
              "repository": "https://github.com/ananan28/WS-",
          })
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          builder_path = root / "electron-builder.yml"
          builder = builder_path.read_text(encoding="utf-8")
          builder = builder.replace('appId: "org.ferdium.ferdium-app"', 'appId: "com.caisheng.multichat"')
          builder = builder.replace('name: Ferdium', 'name: Caisheng MultiChat')
          builder = builder.replace('schemes: [ferdium]', 'schemes: [caisheng]')
          builder = builder.replace('${productName}-${os}-Installer-${version}-${arch}.${ext}', 'Caisheng-MultiChat-Setup-${version}-${arch}.${ext}')
          builder = builder.replace('${productName}-${os}-Portable-${version}-${arch}.${ext}', 'Caisheng-MultiChat-Portable-${version}-${arch}.${ext}')
          builder = builder.replace('unpackDirName: "Ferdium-Unpacked"', 'unpackDirName: "Caisheng-MultiChat-Unpacked"')
          builder = builder.replace('publisherName: ["Ferdium Contributors", "Ambroise Grau"]', 'publisherName: []')
          builder_path.write_text(builder, encoding="utf-8")

          icon = Path("assets/windows/caisheng.ico")
          if not icon.exists():
              raise FileNotFoundError("Missing Caisheng Windows icon")
          shutil.copyfile(icon, root / "build-helpers/images/icon.ico")

          for name in ("zh-HANS.json", "zh.json"):
              path = root / "src/i18n/locales" / name
              if path.exists():
                  value = path.read_text(encoding="utf-8").replace("Ferdium", "财盛聚合聊天")
                  path.write_text(value, encoding="utf-8")

          welcome = root / "src/components/auth/Welcome.tsx"
          value = welcome.read_text(encoding="utf-8")
          marker = "class Welcome extends Component<IProps> {"
          value = value.replace(marker, marker + "\n  componentDidMount(): void {\n    serverlessLogin(this.props.actions);\n  }")
          value = value.replace("<H1>Ferdium</H1>", "<H1>财盛聚合聊天</H1>")
          welcome.write_text(value, encoding="utf-8")

          translation = root / "src/helpers/translation-helpers.ts"
          value = translation.read_text(encoding="utf-8")
          value = value.replace("FERDIUM ERROR: An error occurred. Please select less text to translate or try again later.", "翻译失败，请缩短内容或稍后重试。")
          translation.write_text(value, encoding="utf-8")

      - name: Overlay Caisheng platform modules
        shell: bash
        run: |
          if [ -d overlays/platform-v3 ]; then
            cp -R overlays/platform-v3/. platform/
          fi

      - name: Verify independent-platform boundary
        shell: python
        run: |
          from pathlib import Path
          package = Path("platform/package.json").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/build-windows.yml").read_text(encoding="utf-8")
          assert "财盛聚合聊天" in package
          forbidden = "signalapp/" + "Signal-Desktop"
          assert workflow.count(forbidden) == 0
          assert "OneChat-Dev/onechat" in workflow

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Enable pnpm
        shell: bash
        working-directory: platform
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        shell: bash
        working-directory: platform
        run: pnpm install --frozen-lockfile

      - name: Typecheck independent platform
        shell: bash
        working-directory: platform
        run: pnpm typecheck

      - name: Build installer and portable app
        shell: bash
        working-directory: platform
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm exec preval-build-info-cli
          node esbuild.mjs
          pnpm exec electron-builder --win nsis portable --x64 --publish never

      - name: Verify Windows deliverables
        shell: pwsh
        run: |
          $setup = Get-ChildItem platform/out/Caisheng-MultiChat-Setup-*-x64.exe
          $portable = Get-ChildItem platform/out/Caisheng-MultiChat-Portable-*-x64.exe
          if (-not $setup -or -not $portable) { throw "Missing setup or portable EXE" }

      - name: Upload Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Caisheng-Independent-Platform-Windows-x64
          path: |
            platform/out/Caisheng-MultiChat-Setup-*-x64.exe
            platform/out/Caisheng-MultiChat-Portable-*-x64.exe
            platform/out/*.blockmap
          if-no-files-found: error
          retention-days: 14
