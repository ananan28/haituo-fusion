name: Build Caisheng Aggregator Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fusion/**'
      - '.github/workflows/build-caisheng-onechat.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      USE_HARD_LINKS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout aggregation framework
        shell: bash
        run: |
          cat fusion/source.part-* > caisheng-onechat-source.zip
          powershell -NoProfile -Command "Expand-Archive -Path caisheng-onechat-source.zip -DestinationPath app -Force"
          git clone --depth 1 https://github.com/ferdium/ferdium-recipes.git app/recipes
      - name: Restore upstream UI module
        shell: bash
        run: |
          mkdir -p app/src/components/ui/icon
          curl -fsSL https://raw.githubusercontent.com/ferdium/ferdium-app/develop/src/components/ui/icon/index.tsx             -o app/src/components/ui/icon/index.tsx
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build recipes
        working-directory: app/recipes
        run: |
          pnpm install
          pnpm package
      - name: Build setup and portable EXE
        working-directory: app
        run: pnpm build --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Caisheng-MultiChat-Windows-x64
          path: |
            app/out/Caisheng-MultiChat-Windows-x64-Setup-*.exe
            app/out/Caisheng-MultiChat-Windows-x64-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
