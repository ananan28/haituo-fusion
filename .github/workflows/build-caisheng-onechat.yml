name: 已停用：旧 OneChat/Ferdium 构建

# 此工作流故意不提供任何触发器。
# 财盛聚合聊天只能由 build-windows.yml 构建仓库内 native-shell，
# 禁止重新引入 OneChat、Ferdium 或 Signal Desktop 外壳。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-build-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: 旧外壳构建已永久停用
        run: |
          echo "请使用 .github/workflows/build-windows.yml"
          exit 1
